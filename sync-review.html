<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sendcloud Sync | Mega Packaging</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; background: #f6f5f1;
    overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: #1a1d1a;
    min-height: 100vh; max-width: 100vw;
  }

  /* ---------- PIN screen ---------- */
  #pin-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
  }
  #pin-box {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    background: #fff; border-radius: 16px; padding: 34px 28px; width: min(340px, 100%);
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  #pin-box h1 { font-size: 17px; margin: 0; text-align: center; }
  #pin-input {
    width: 100%; font-size: 28px; text-align: center; letter-spacing: 12px; padding: 12px;
    border: 2px solid #d8d5cc; border-radius: 9px; box-sizing: border-box;
  }
  #pin-error { color: #a33; font-size: 13px; font-weight: 700; min-height: 18px; text-align: center; }
  #pin-ok {
    width: 100%; padding: 13px 0; font-size: 15px; font-weight: 800; border-radius: 9px; border: none;
    background: #2f6b3e; color: #fff; cursor: pointer;
  }

  /* ---------- Main page ---------- */
  #page { display: none; padding: 14px; padding-bottom: 60px; max-width: 720px; margin: 0 auto; }
  #page.active { display: block; }
  .page-title { font-size: 19px; font-weight: 900; margin: 4px 0 4px; }
  .page-subtitle { font-size: 12.5px; color: #777; margin: 0 0 16px; line-height: 1.4; }

  .card {
    background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }
  .card h2 { font-size: 14px; font-weight: 800; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  .card p.hint { font-size: 12.5px; color: #777; line-height: 1.4; margin: 0 0 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: 9px; border: none; font-size: 14px; font-weight: 800;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    width: 100%;
  }
  .btn-primary { background: #c65d2e; color: #fff; }
  .btn-ghost { background: #f0efe9; color: #444; }
  .btn-good { background: #2f6b3e; color: #fff; }
  .btn-danger { background: #a33; color: #fff; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .btn:disabled { opacity: 0.5; }

  .status-line { font-size: 12.5px; color: #555; margin-top: 10px; line-height: 1.4; }

  input[type="text"], textarea {
    width: 100%; font-size: 14px; padding: 10px 12px; border: 1.5px solid #ddd9cf; border-radius: 8px;
    box-sizing: border-box; font-family: inherit; margin-bottom: 8px;
  }
  input[type="file"] { font-size: 13px; margin-bottom: 8px; width: 100%; }

  .review-card {
    border: 1.5px solid #ddd9cf; border-radius: 10px; padding: 12px; margin-bottom: 10px;
  }
  .review-card.flagged { border-color: #d99b1c; background: #fdf6e5; }
  .review-card.stuck { border-color: #c0392b; background: #fbebe9; }
  .review-flag {
    font-size: 12px; font-weight: 800; color: #a3701c; background: #fbeccc; padding: 6px 9px;
    border-radius: 6px; margin-bottom: 10px; white-space: pre-wrap; line-height: 1.4;
  }
  .review-flag.stuck { color: #a33; background: #f5d5d1; }
  .review-header { font-weight: 800; font-size: 15px; margin-bottom: 10px; }

  .compare-block { margin-bottom: 10px; }
  .compare-label {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
    color: #999; margin-bottom: 4px;
  }
  .compare-original {
    background: #f6f5f1; border-radius: 7px; padding: 8px 10px; font-size: 12.5px; color: #555;
    margin-bottom: 8px; line-height: 1.5;
  }
  .compare-original .item-row { padding: 3px 0; border-bottom: 1px dashed #ddd; }
  .compare-original .item-row:last-child { border-bottom: none; }
  .compare-original .item-sku { font-family: monospace; font-weight: 700; color: #1a1d1a; }
  .compare-converted-textarea {
    width: 100%; min-height: 54px; font-size: 13.5px; font-family: monospace; padding: 9px;
    border: 1.5px solid #ccc; border-radius: 7px; box-sizing: border-box; background: #fff;
  }

  .empty-note { color: #999; font-size: 13px; text-align: center; padding: 24px 10px; }

  /* ---------- Review queue tabs ---------- */
  /* Horizontally scrollable so six tabs fit a phone without shrinking to
     nothing. */
  .tabs {
    display: flex; gap: 4px; margin: 0 0 12px;
    border-bottom: 1.5px solid #e6e3da;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 10px 12px; font-size: 13px; font-weight: 800; font-family: inherit;
    white-space: nowrap;
    background: none; border: none; border-bottom: 3px solid transparent;
    color: #999; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; margin-bottom: -1.5px;
  }
  .tab.attention { color: #a33; }
  .tab.attention.active { border-bottom-color: #c0392b; }
  .tab.attention .tab-count { background: #f3dcd8; color: #a33; }
  .tab.attention.active .tab-count { background: #c0392b; color: #fff; }
  .tab.warn { color: #a3701c; }
  .tab.warn.active { border-bottom-color: #d99b1c; }
  .tab.warn .tab-count { background: #f7ecd6; color: #a3701c; }
  .tab.warn.active .tab-count { background: #d99b1c; color: #fff; }
  .tab.active { color: #1a1d1a; border-bottom-color: #c65d2e; }
  .tab-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; padding: 2px 6px; border-radius: 10px;
    background: #ece9e1; color: #777; font-size: 11.5px; font-weight: 800;
  }
  .tab.active .tab-count { background: #c65d2e; color: #fff; }
  .other-type-row {
    display: flex; gap: 10px; align-items: flex-start;
    background: #f4f1e9; border: 1.5px solid #e6e3da; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px; cursor: pointer;
  }
  .other-type-row input[type="checkbox"] {
    width: 20px; height: 20px; margin: 1px 0 0; flex: 0 0 auto; accent-color: #c65d2e; cursor: pointer;
  }
  .other-type-row span { font-size: 13px; line-height: 1.45; color: #1a1d1a; }
  .other-type-row small { display: block; color: #777; font-size: 12px; margin-top: 3px; }
  .other-type-row.active { border-color: #c65d2e; background: #fbf1ea; }
  .field-hidden { display: none !important; }

  .ns-row { padding: 11px 0; border-bottom: 1px solid #ece9e1; }
  .ns-row:last-child { border-bottom: none; }
  .ns-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ns-name { font-weight: 900; font-size: 15.5px; color: #1a1d1a; }
  .ns-products { font-size: 13.5px; font-weight: 700; color: #333; margin-top: 5px; line-height: 1.4; }
  .ns-age {
    font-size: 11px; font-weight: 800; color: #8a6412; background: #fdf3e4;
    border: 1px solid #edd8ae; border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .ns-meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: #777; margin-top: 4px; line-height: 1.6; word-break: break-all;
  }

  .learned-row { padding: 11px 0; border-bottom: 1px solid #ece9e1; }
  .learned-row:last-child { border-bottom: none; }
  .learned-sku {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; font-weight: 800; color: #1a1d1a; word-break: break-all;
  }
  .learned-rule { font-size: 13px; color: #555; margin-top: 3px; line-height: 1.45; }
  .learned-rule .learned-per { color: #999; }
  /* Own sizing rather than .btn, which is width:100% and would fill the row. */
  .learned-actions { display: flex; gap: 8px; margin-top: 8px; }
  .learned-btn {
    width: auto; padding: 6px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 800;
    font-family: inherit; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; border: 1.5px solid;
  }
  .learned-btn.edit { border-color: #c9c5b9; background: #fff; color: #444; }
  .learned-btn.remove { border-color: #b03636; background: #fff; color: #b03636; }
  .learned-btn.save { border-color: #2f6b3e; background: #2f6b3e; color: #fff; }
  .learned-btn.cancel { border-color: #c9c5b9; background: #fff; color: #444; }
  .learned-edit-form { margin-top: 8px; }
  .learned-edit-form input[type="text"],
  .learned-edit-form input[type="number"] { margin-bottom: 6px; }
  .learned-field-label { font-size: 11.5px; font-weight: 800; color: #777; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .learned-fixed-row { display: flex; align-items: flex-start; gap: 8px; margin: 2px 0 8px; font-size: 12.5px; color: #555; line-height: 1.4; }
  .learned-fixed-row input { width: 18px; height: 18px; margin: 0; flex: 0 0 auto; accent-color: #c65d2e; }

  .tab-empty {
    color: #999; font-size: 13px; text-align: center; padding: 20px 10px; line-height: 1.5;
  }

  .manual-labels-list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #f6f5f1; border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px;
  }
  .manual-labels-list-item button {
    flex-shrink: 0; padding: 5px 10px; font-size: 12px; font-weight: 700; border-radius: 6px;
    border: 1.5px solid #a33; background: #fff; color: #a33; cursor: pointer;
  }

  .skipped-item {
    background: #f6f5f1; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
  }
  .skipped-item .skipped-line { margin-bottom: 3px; line-height: 1.4; }
  .skipped-item .skipped-label { font-weight: 700; color: #777; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  .skipped-item .skipped-name { font-weight: 700; }
  .skipped-item button {
    margin-top: 6px; width: 100%; padding: 8px 0; font-size: 12.5px; font-weight: 700; border-radius: 6px;
    border: 1.5px solid #c65d2e; background: #fff; color: #c65d2e; cursor: pointer;
  }
  .skipped-item button:disabled { opacity: 0.5; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center;
    justify-content: center; z-index: 500; padding: 20px;
  }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 20px; width: min(360px, 100%);
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal-box p { margin: 0 0 4px; font-size: 14px; font-weight: 700; text-align: center; }
</style>
</head>
<body>

<div id="pin-screen">
  <div id="pin-box">
    <h1>Sendcloud Sync<br/>Mega Packaging</h1>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin-input" autocomplete="off" />
    <div id="pin-error"></div>
    <button id="pin-ok" class="btn btn-good">Unlock</button>
  </div>
</div>

<div id="page">
  <div class="page-title">Sendcloud Sync</div>

  <div class="card">
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-sync">Sync from Sendcloud</button>
      <button class="btn btn-danger" data-bulk="clear-everything">Clear All</button>
    </div>
    <div class="status-line" id="sync-status"></div>
    <div class="status-line" id="top-status"></div>
  </div>

  <!-- One tab strip for everything, so nothing needs a heading or a
       description taking up room above it. Counts appear only when there is
       something in that tab. -->
  <div class="tabs" id="main-tabs">
    <button class="tab attention" data-tab="attention" style="display:none;">Attention <span class="tab-count" id="count-attention">0</span></button>
    <button class="tab" data-tab="eightply">8ply x1 <span class="tab-count" id="count-eightply">0</span></button>
    <button class="tab" data-tab="other">Other <span class="tab-count" id="count-other">0</span></button>
    <button class="tab" data-tab="skipped">Duplicates <span class="tab-count" id="count-skipped">0</span></button>
    <button class="tab warn" data-tab="notscanned" style="display:none;">Not scanned <span class="tab-count" id="count-notscanned">0</span></button>
    <button class="tab" data-tab="upload">Upload</button>
    <button class="tab" data-tab="learned">Learned</button>
  </div>

  <div class="card tab-panel" id="panel-attention" style="display:none;">
    <div id="attention-list"></div>
  </div>

  <div class="card tab-panel" id="panel-eightply" style="display:none;">
    <div class="tab-empty" id="eightply-empty" style="display:none;">No 8ply x1 orders.</div>
    <!-- Same actions top and bottom, so a long list doesn't have to be
         scrolled to the end to act on it. -->
    <div class="btn-row eightply-bulk" style="display:none; margin-bottom:10px;">
      <button class="btn btn-good" data-bulk="upload-8ply">Upload All 8ply x1</button>
    </div>
    <div id="eightply-list"></div>
    <div class="btn-row eightply-bulk" style="display:none; margin-top:6px;">
      <button class="btn btn-good" data-bulk="upload-8ply">Upload All 8ply x1</button>
    </div>
  </div>

  <div class="card tab-panel" id="panel-other" style="display:none;">
    <div class="tab-empty" id="other-empty" style="display:none;">No other orders.</div>
    <div class="btn-row review-bulk" style="display:none; margin-bottom:10px;">
      <button class="btn btn-good" data-bulk="approve-all">Approve All</button>
      <button class="btn btn-danger" data-bulk="reject-all">Reject All</button>
    </div>
    <div id="review-list"></div>
    <div class="btn-row review-bulk" style="display:none; margin-top:6px;">
      <button class="btn btn-good" data-bulk="approve-all">Approve All</button>
      <button class="btn btn-danger" data-bulk="reject-all">Reject All</button>
    </div>
  </div>

  <div class="card tab-panel" id="panel-skipped" style="display:none;">
    <div class="tab-empty" id="skipped-empty" style="display:none;">Nothing skipped that needs a look.</div>
    <div id="skipped-list"></div>
  </div>

  <div class="card tab-panel" id="panel-notscanned" style="display:none; border:2px solid #d99b1c;">
    <div id="notscanned-list"></div>
  </div>

  <div class="card tab-panel" id="panel-upload" style="display:none;">
    <label class="other-type-row">
      <input type="checkbox" id="manual-other-type" />
      <span><strong>Other file type</strong> — general print, not a scannable label</span>
    </label>
    <input type="text" id="manual-name" placeholder="Customer name" />
    <input type="text" id="manual-postcode" placeholder="Postcode (optional but recommended)" />
    <input type="text" id="manual-products" placeholder="Products, e.g. 8ply x1 + wood fork x2" />
    <input type="file" id="manual-file" accept="application/pdf,image/jpeg,image/png,image/bmp,.pdf,.jpg,.jpeg,.png,.bmp" />
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-upload-manual">Upload Label &amp; Add Slot</button>
    </div>
    <div class="status-line" id="manual-status"></div>
    <div id="manual-labels-list" style="margin-top:10px;"></div>
  </div>

  <div class="card tab-panel" id="panel-learned" style="display:none;">
    <div class="tab-empty" id="learned-empty" style="display:none;">Nothing learned yet. Correct a flagged order and you'll be asked to save it.</div>
    <div id="learned-list"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfgBcWvpnZYMWBb_I9b1gX0xkFMgWU99w",
    authDomain: "mega-packaging-parcels.firebaseapp.com",
    projectId: "mega-packaging-parcels",
    storageBucket: "mega-packaging-parcels.firebasestorage.app",
    messagingSenderId: "792403680019",
    appId: "1:792403680019:web:474d448da9633ec98118e6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storageCollection = db.collection('warehouse-storage');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function storageGet(key) {
    const doc = await storageCollection.doc(key).get();
    if (!doc.exists) return null;
    return doc.data().value;
  }

  // ---------- PIN gate — same multi-user PIN system as the summary page ----------
  async function checkPin(pin) {
    const value = await storageGet('summary-pins');
    if (!value) return { ok: false, reason: 'No PINs have been configured yet — set one up in Back End first.' };
    let pins;
    try { pins = JSON.parse(value); } catch (e) { pins = []; }
    const match = pins.find(p => p.pin === pin && p.active);
    return match ? { ok: true } : { ok: false, reason: 'Incorrect or inactive PIN.' };
  }

  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');

  async function submitPin() {
    const pin = pinInput.value.trim();
    if (!/^\d{4}$/.test(pin)) { pinError.textContent = 'Enter the 4-digit PIN.'; return; }
    pinError.textContent = 'Checking…';
    const result = await checkPin(pin);
    if (result.ok) {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('page').classList.add('active');
      renderManualLabelsList();
      renderReviewQueue();
      renderSkippedList();
      renderLearnedList();
      renderNotScanned();
    } else {
      pinError.textContent = result.reason;
      pinInput.value = '';
    }
  }
  document.getElementById('pin-ok').addEventListener('click', submitPin);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });
  pinInput.addEventListener('input', () => { if (pinInput.value.length === 4) submitPin(); });
  pinInput.focus();

  // ---------- Add an approved order as a real slot (same format as the main app) ----------
  function monthKeyFor(ts) {
    const d = new Date(ts);
    return 'orders:' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  // A name line can end with a bare "(N)" — e.g. "Emil Kajsik (2)" or
  // "Sarah Baxter (BD17 5PH) (4)" — meaning that order was built from N
  // physical labels. The Warehouse app strips this out and records it as a
  // labelCount so the card shows a badge and the scan process expects N
  // barcodes instead of one.
  //
  // The app only did that when pasting orders in or when editing and saving
  // a slot, which is why typing "(2)" on the sync page appeared to do
  // nothing until the slot was edited and re-saved. It now happens here too,
  // so it works straight from approval.
  //
  // Only a TRAILING parenthetical of digits ONLY is matched, so a postcode
  // like "(BD17 5PH)" earlier in the line is never mistaken for a count.
  function extractLabelCount(raw) {
    const lines = String(raw || '').split('\n');
    const m = lines[0].match(/\s*\((\d+)\)\s*$/);
    if (!m) return { raw, labelCount: null };
    lines[0] = lines[0].slice(0, m.index).trimEnd();
    return { raw: lines.join('\n'), labelCount: parseInt(m[1], 10) };
  }

  async function addOrderAsSlot(raw, sourceOrderNumbers, notProcessedType, nonScannable, trackingNumbers) {
    const now = Date.now();
    const key = monthKeyFor(now);
    const { raw: cleanRaw, labelCount } = extractLabelCount(raw);
    const entry = { raw: cleanRaw, addedAt: now, id: now + '-' + Math.random().toString(36).slice(2, 8) };
    if (labelCount != null) entry.labelCount = labelCount;
    if (sourceOrderNumbers && sourceOrderNumbers.length) entry.sourceOrderNumbers = sourceOrderNumbers;
    if (trackingNumbers && trackingNumbers.length) entry.trackingNumbers = trackingNumbers;
    if (notProcessedType) entry.notProcessedType = true;
    // General prints (name prints etc.) have no barcode, so the Warehouse
    // app turns these blue on print rather than purple-then-scan.
    if (nonScannable) entry.nonScannable = true;
    let existing = [];
    const res = await storageCollection.doc(key).get();
    if (res.exists) {
      try { existing = JSON.parse(res.data().value); } catch (e) { existing = []; }
    }
    existing.push(entry);
    await storageCollection.doc(key).set({ value: JSON.stringify(existing), shared: true, updatedAt: now });
  }

  // Batch version — for bulk uploads. Adding orders one at a time meant a
  // full read-and-rewrite of the whole month document per order, which is
  // what made "Upload All" appear to hang on a big batch. This reads the
  // month once, appends everything, and writes once.
  async function addOrdersAsSlots(items) {
    if (!items.length) return;
    const now = Date.now();
    const key = monthKeyFor(now);
    let existing = [];
    const res = await storageCollection.doc(key).get();
    if (res.exists) {
      try { existing = JSON.parse(res.data().value); } catch (e) { existing = []; }
    }
    items.forEach((it, i) => {
      const { raw: cleanRaw, labelCount } = extractLabelCount(it.raw);
      const entry = { raw: cleanRaw, addedAt: now + i, id: (now + i) + '-' + Math.random().toString(36).slice(2, 8) };
      if (labelCount != null) entry.labelCount = labelCount;
      if (it.sourceOrderNumbers && it.sourceOrderNumbers.length) entry.sourceOrderNumbers = it.sourceOrderNumbers;
      if (it.trackingNumbers && it.trackingNumbers.length) entry.trackingNumbers = it.trackingNumbers;
      if (it.notProcessedType) entry.notProcessedType = true;
      existing.push(entry);
    });
    await storageCollection.doc(key).set({ value: JSON.stringify(existing), shared: true, updatedAt: now });
  }

  // Runs promises in parallel batches instead of strictly one after another.
  // Firestore handles concurrent deletes fine, and this turns a queue of
  // several hundred into seconds rather than minutes. onProgress reports
  // after each batch so the button can show live progress.
  async function runInBatches(items, size, fn, onProgress) {
    let done = 0;
    for (let i = 0; i < items.length; i += size) {
      const chunk = items.slice(i, i + size);
      await Promise.all(chunk.map(fn));
      done += chunk.length;
      if (onProgress) onProgress(done, items.length);
    }
  }

  // ---------- Sync from Sendcloud ----------
  document.getElementById('btn-sync').addEventListener('click', async () => {
    const btn = document.getElementById('btn-sync');
    const statusEl = document.getElementById('sync-status');
    btn.disabled = true;
    statusEl.textContent = 'Requesting sync…';
    try {
      const docRef = await db.collection('sync-requests').add({ status: 'pending', requestedAt: Date.now() });
      statusEl.textContent = 'Waiting for the print-watcher program to fetch orders from Sendcloud…';
      const startedAt = Date.now();
      const check = async () => {
        const doc = await db.collection('sync-requests').doc(docRef.id).get();
        const data = doc.exists ? doc.data() : null;
        if (data && data.status === 'done') {
          statusEl.textContent = `Done — ${data.importedCount != null ? data.importedCount : '?'} order(s) queued below for review (${data.skippedCount != null ? data.skippedCount : 0} already in the system).`;
          renderSkippedList();
          renderNotScanned();
          // The queue has to be rendered before anything can be
          // auto-approved: the approve step reads the converted text out of
          // each card's textarea, so the cards must exist first.
          await renderReviewQueue();
          await autoApproveEightPly(statusEl);
          btn.disabled = false;
          return;
        }
        if (data && data.status === 'failed') {
          statusEl.textContent = 'Sync failed: ' + (data.errorMessage || 'unknown error');
          btn.disabled = false;
          return;
        }
        // print-watcher checks for sync requests every ~30s (kept low to stay
        // inside Firestore's daily free-tier quota), so allow generous time
        // for pickup plus the sync itself before declaring it dead.
        if (Date.now() - startedAt > 150000) {
          statusEl.textContent = 'Timed out waiting for the print-watcher program — is it running on the warehouse computer?';
          btn.disabled = false;
          return;
        }
        setTimeout(check, 2000);
      };
      check();
    } catch (e) {
      statusEl.textContent = 'Could not request sync — try again. (' + (e && e.message ? e.message : 'unknown error') + ')';
      btn.disabled = false;
    }
  });

  // ---------- 8ply x1 detection ----------
  // True ONLY when the whole order is a single 8ply at quantity 1 and nothing
  // else. Anything with a second product, or an 8ply at any other quantity,
  // deliberately falls through to the normal "Other orders" tab.
  // Line 1 of raw is the customer header; everything after it is products.
  function isEightPlySingle(raw) {
    const lines = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.length < 2) return false;
    const parts = lines.slice(1).join(' + ').split('+').map(s => s.trim()).filter(Boolean);
    if (parts.length !== 1) return false;          // more than one product line/item
    const item = parts[0].toLowerCase().replace(/\s+/g, ' ');
    return /^8\s*ply\s*x\s*1$/.test(item);         // "8ply x1", "8 ply x 1" — but not x2, x10
  }

  // ---------- Review queue ----------
  function buildReviewCardHtml(doc, d) {
    let originalItems = [];
    try { originalItems = JSON.parse(d.originalItemsJson || '[]'); } catch (e) {}
    const headerLine = String(d.raw || '').split('\n')[0];
    const nameOnly = headerLine.replace(/\s*\([^)]*\)\s*$/, '').trim();

    const originalHtml = originalItems.length
      ? originalItems.map(it => `
          <div class="item-row">
            <span class="item-sku">${escapeHtml(it.sku || '(no SKU)')}</span> — qty ${escapeHtml(String(it.qty))}
          </div>`).join('')
      : '<div class="item-row">No original item data saved for this entry — likely queued by an older sync run. Reject it and run Sync again to get full details.</div>';

    return `
      <div class="review-card${d.needsReview ? ' flagged' : ''}${d.isStuckOrder ? ' stuck' : ''}" data-id="${doc.id}">
        ${d.needsReview ? `<div class="review-flag${d.isStuckOrder ? ' stuck' : ''}">${d.isStuckOrder ? '🔴' : '⚠️'} ${escapeHtml(d.reviewReasons || 'Needs review')}</div>` : ''}
        <div class="review-header long-press-target" data-name="${escapeHtml(nameOnly)}">${escapeHtml(headerLine)}</div>

        <div class="compare-block">
          <div class="compare-label">Original (from Sendcloud)</div>
          <div class="compare-original">${originalHtml}</div>
        </div>

        <div class="compare-block">
          <div class="compare-label">Converted for our system (editable)</div>
          <textarea class="compare-converted-textarea" data-id="${doc.id}">${escapeHtml(d.raw || '')}</textarea>
        </div>

        <div class="btn-row" style="margin-bottom:8px;">
          <button class="btn btn-ghost" data-action="mark-notprocessed" data-id="${doc.id}">Not Processed</button>
        </div>

        <div class="btn-row">
          <button class="btn btn-good" data-action="approve-one" data-id="${doc.id}">Approve &amp; Add</button>
          <button class="btn btn-danger" data-action="reject-one" data-id="${doc.id}">Reject</button>
        </div>
      </div>`;
  }

  // ---------- Tabs ----------
  const ALL_TABS = ['attention', 'eightply', 'other', 'skipped', 'notscanned', 'upload', 'learned'];
  let activeTab = null;
  let userPickedTab = false;   // once you choose a tab, renders stop moving you

  function setTab(tab, byUser) {
    if (!ALL_TABS.includes(tab)) return;
    activeTab = tab;
    if (byUser) userPickedTab = true;
    document.querySelectorAll('#main-tabs .tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    for (const t of ALL_TABS) {
      const panel = document.getElementById('panel-' + t);
      if (panel) panel.style.display = t === tab ? 'block' : 'none';
    }
  }

  // Counts double as visibility: a tab with nothing in it and nothing to do
  // is hidden rather than shown empty.
  function setTabCount(tab, n, hideWhenEmpty) {
    const countEl = document.getElementById('count-' + tab);
    const btn = document.querySelector(`#main-tabs .tab[data-tab="${tab}"]`);
    if (countEl) countEl.textContent = n;
    if (!btn) return;
    if (hideWhenEmpty) {
      btn.style.display = n > 0 ? '' : 'none';
      // Don't leave the user staring at a panel that just emptied itself.
      if (n === 0 && activeTab === tab) { userPickedTab = false; chooseDefaultTab(); }
    }
    if (countEl) countEl.style.display = n > 0 ? '' : 'none';
  }

  // Most urgent thing first: flagged orders, then the queue, then duplicates.
  function chooseDefaultTab() {
    if (userPickedTab && activeTab) { setTab(activeTab); return; }
    const n = (id) => parseInt(document.getElementById('count-' + id).textContent, 10) || 0;
    if (n('attention') > 0) return setTab('attention');
    if (n('eightply') > 0) return setTab('eightply');
    if (n('other') > 0) return setTab('other');
    if (n('skipped') > 0) return setTab('skipped');
    if (n('notscanned') > 0) return setTab('notscanned');
    setTab('upload');
  }

  document.getElementById('main-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (btn) setTab(btn.dataset.tab, true);

  const REVIEW_DISPLAY_LIMIT = 300;

  // Shows a failure on the page instead of letting it vanish. These render
  // functions are called without a .catch(), so anything that throws used to
  // leave the card hidden with no message at all — the queue simply appeared
  // empty when it wasn't.
  function showRenderError(where, e) {
    const statusEl = document.getElementById('top-status');
    const msg = (e && e.message) ? e.message : String(e);
    if (statusEl) statusEl.textContent = `Could not load ${where}: ${msg}`;
    console.error(`[${where}]`, e);
  }

  async function fetchReviewDocs() {
    // Firestore omits documents that don't have the field being ordered on.
    // If anything wrote a queue item without createdAt, an ordered query
    // returns nothing and the queue looks empty even though items exist.
    // So: try ordered first, and if that comes back empty, check again
    // without the ordering before believing it.
    const ordered = await db.collection('pending-sync-review').orderBy('createdAt').limit(REVIEW_DISPLAY_LIMIT).get();
    if (!ordered.empty) return ordered.docs;
    const unordered = await db.collection('pending-sync-review').limit(REVIEW_DISPLAY_LIMIT).get();
    if (!unordered.empty) {
      console.warn('Review items exist but have no createdAt — showing them unordered.');
    }
    return unordered.docs;
  }

  async function renderReviewQueue() {
    try {
      await renderReviewQueueInner();
    } catch (e) {
      showRenderError('the review queue', e);
    }
  }

  async function renderReviewQueueInner() {
    const attentionListEl = document.getElementById('attention-list');
    const listEl = document.getElementById('review-list');
    const eightplyListEl = document.getElementById('eightply-list');
    // Capped so a large backlog can't lock up the browser — every card is a
    // live textarea, and thousands of them will freeze the page. Work
    // through it in passes; the next batch appears after each upload.
    const docs = await fetchReviewDocs();

    if (docs.length === 0) {
      attentionListEl.innerHTML = '';
      listEl.innerHTML = '';
      eightplyListEl.innerHTML = '';
      setTabCount('attention', 0, true);
      setTabCount('eightply', 0, false);
      setTabCount('other', 0, false);
      document.getElementById('eightply-empty').style.display = 'block';
      document.getElementById('other-empty').style.display = 'block';
      document.querySelectorAll('.eightply-bulk, .review-bulk').forEach(el => { el.style.display = 'none'; });
      chooseDefaultTab();
      return;
    }

    const attentionCards = [];
    const eightplyCards = [];
    const normalCards = [];
    let broken = 0;
    docs.forEach(doc => {
      // One malformed entry shouldn't take the whole queue down with it.
      try {
        const d = doc.data();
        const html = buildReviewCardHtml(doc, d);
        // Flagged orders stay in Needs Attention no matter what they contain —
        // an 8ply x1 with an unrecognised SKU shouldn't be bulk-uploaded blind.
        if (d.needsReview) attentionCards.push(html);
        else if (isEightPlySingle(d.raw)) eightplyCards.push(html);
        else normalCards.push(html);
      } catch (e) {
        broken++;
        console.error('Could not render review item', doc.id, e);
      }
    });

    attentionListEl.innerHTML = attentionCards.join('');
    setTabCount('attention', attentionCards.length, true);
    setTabCount('eightply', eightplyCards.length, false);
    setTabCount('other', normalCards.length, false);

    const notes = [];
    if (docs.length >= REVIEW_DISPLAY_LIMIT) {
      notes.push(`Showing the oldest ${REVIEW_DISPLAY_LIMIT} of a larger queue. Clear these and the next batch loads.`);
    }
    if (broken) {
      notes.push(`${broken} item(s) could not be displayed and were skipped — use Reject All to clear them.`);
    }
    const cappedNote = notes.length
      ? `<div class="tab-empty" style="text-align:left; padding:8px 0;">${notes.join('<br/>')}</div>`
      : '';

    eightplyListEl.innerHTML = cappedNote + eightplyCards.join('');
    document.querySelectorAll('.eightply-bulk').forEach(el => { el.style.display = eightplyCards.length > 0 ? 'flex' : 'none'; });
    document.getElementById('eightply-empty').style.display = eightplyCards.length > 0 ? 'none' : 'block';

    listEl.innerHTML = cappedNote + normalCards.join('');
    document.querySelectorAll('.review-bulk').forEach(el => { el.style.display = normalCards.length > 0 ? 'flex' : 'none'; });
    document.getElementById('other-empty').style.display = normalCards.length > 0 ? 'none' : 'block';

    chooseDefaultTab();
  }

  // ---------- Teaching the system a SKU ----------
  // When a flagged item is corrected by hand, work out which SKU the
  // correction belongs to and offer to remember it, so the same SKU converts
  // itself next time.
  //
  // The product line is split on "+" and compared part by part. Only the
  // parts that actually changed are considered, so correcting one item in a
  // multi-item order doesn't get confused by the items left alone.
  function splitParts(raw) {
    const lines = String(raw || '').split('\n');
    return lines.slice(1).join(' + ').split('+').map(s => s.trim()).filter(Boolean);
  }

  // "[UNRECOGNISED SKU: RND03] x1"      -> { sku: 'RND03', qty: 1 }
  // "[NEEDS REVIEW: 2ply-1000 qty 3]"   -> { sku: '2ply-1000', qty: 3 }
  function parseFlaggedPart(part) {
    let m = part.match(/^\[UNRECOGNISED SKU:\s*(.+?)\]\s*x\s*(\d+)\s*$/i);
    if (m) return { sku: m[1].trim(), qty: parseInt(m[2], 10) };
    m = part.match(/^\[NEEDS REVIEW:\s*(.+?)\s+qty\s+(\d+)\]\s*$/i);
    if (m) return { sku: m[1].trim(), qty: parseInt(m[2], 10) };
    return null;
  }

  // "9ply x24" -> { label: '9ply', count: 24 }
  function parseCorrectedPart(text) {
    const m = String(text).match(/^(.*?)\s*x\s*(\d+)\s*$/i);
    if (m && m[1].trim()) return { label: m[1].trim(), count: parseInt(m[2], 10) };
    return { label: String(text).trim(), count: null };
  }

  function diffCorrection(originalRaw, correctedRaw) {
    const before = splitParts(originalRaw);
    const after = splitParts(correctedRaw);
    // Drop the parts that are identical in both, matching them up one for one.
    const remainingAfter = after.slice();
    const changedBefore = [];
    for (const p of before) {
      const i = remainingAfter.indexOf(p);
      if (i >= 0) remainingAfter.splice(i, 1);
      else changedBefore.push(p);
    }
    if (changedBefore.length !== 1) return null;   // ambiguous — don't guess
    const flagged = parseFlaggedPart(changedBefore[0]);
    if (!flagged) return null;                      // only learn from flagged items
    if (remainingAfter.length === 0) return null;   // item was removed, nothing to learn
    const corrected = parseCorrectedPart(remainingAfter.join(' + '));
    const per = (corrected.count != null && flagged.qty > 0 && corrected.count % flagged.qty === 0)
      ? corrected.count / flagged.qty
      : null;
    return {
      sku: flagged.sku,
      qty: flagged.qty,
      correctedText: remainingAfter.join(' + '),
      label: corrected.label,
      count: corrected.count,
      unitsPerItem: per
    };
  }

  async function offerToLearn(originalRaw, correctedRaw) {
    const d = diffCorrection(originalRaw, correctedRaw);
    if (!d) return;
    // Already known? Don't nag about a SKU that's been taught.
    try {
      const existing = await db.collection('sku-corrections').where('sku', '==', d.sku).limit(1).get();
      if (!existing.empty) return;
    } catch (e) { /* if the check fails, still offer */ }

    const scales = d.unitsPerItem != null;
    const detail = scales
      ? `Remember this for next time?\n\nSKU: ${d.sku}\nProduct: ${d.label}\nQuantity: ${d.unitsPerItem} per item\n\nSo qty ${d.qty} becomes "${d.label} x${d.count}", and qty 5 would become "${d.label} x${d.unitsPerItem * 5}".`
      : `Remember this for next time?\n\nSKU: ${d.sku}\nAlways write: ${d.correctedText}\n\nThis exact text will be used whatever the quantity.`;
    if (!confirm(detail)) return;

    let unitsPerItem = d.unitsPerItem != null ? d.unitsPerItem : 1;
    let mode = scales ? 'scale' : 'fixed';
    if (scales) {
      const answer = prompt(`How many "${d.label}" is ONE ${d.sku}?\n\nLeave as ${d.unitsPerItem} if that's right. Enter 0 to always write "${d.correctedText}" exactly, whatever the quantity.`, String(d.unitsPerItem));
      if (answer === null) return;
      const n = parseInt(answer, 10);
      if (isNaN(n)) return;
      if (n === 0) { mode = 'fixed'; unitsPerItem = 1; }
      else unitsPerItem = n;
    }

    try {
      await db.collection('sku-corrections').add({
        sku: d.sku,
        label: mode === 'fixed' ? d.correctedText : d.label,
        unitsPerItem,
        mode,
        override: false,
        exampleFrom: `qty ${d.qty}`,
        exampleTo: d.correctedText,
        createdAt: Date.now()
      });
      document.getElementById('top-status').textContent = `Saved — ${d.sku} will convert automatically from now on.`;
      renderLearnedList();
    } catch (e) {
      document.getElementById('top-status').textContent = 'Could not save that correction — ' + ((e && e.message) || 'try again') + '.';
    }
  }

  // ---------- Not scanned ----------
  // Same list the Warehouse header shows, but with actions here: reprint the
  // label, add it back as a slot for re-doing, or dismiss it once chased.
  let notScannedItems = [];
  let dismissedNotScanned = new Set();

  async function renderNotScanned() {
    try { await renderNotScannedInner(); } catch (e) { showRenderError('the not-scanned list', e); }
  }

  async function renderNotScannedInner() {
    const listEl = document.getElementById('notscanned-list');
    const doc = await db.collection('print-watcher-control').doc('not-scanned').get();
    notScannedItems = doc.exists ? JSON.parse(doc.data().itemsJson || '[]') : [];
    const visible = notScannedItems.filter(i => !dismissedNotScanned.has(i.trackingNumber || i.shipmentId));

      listEl.innerHTML = '';

    listEl.innerHTML = visible.map((i, idx) => {

      <div class="ns-row" data-key="${escapeHtml(key)}">
        <div class="ns-top">
          <span class="ns-name">${escapeHtml(i.name || '')}${i.postcode ? ' (' + escapeHtml(i.postcode) + ')' : ''}</span>
          <span class="ns-age">${i.daysOld} day${i.daysOld === 1 ? '' : 's'}</span>
        </div>
        ${i.products ? `<div class="ns-products">${escapeHtml(i.products)}</div>` : ''}
        <div class="ns-meta">
          ${i.orderNumber ? 'Order ' + escapeHtml(i.orderNumber) + '<br/>' : 'No order number<br/>'}
          ${i.trackingNumber ? 'Tracking ' + escapeHtml(i.trackingNumber) + '<br/>' : ''}

          <button class="learned-btn remove" data-action="ns-dismiss" data-idx="${idx}">Dismiss</button>
        </div>

  document.getElementById('notscanned-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const visible = notScannedItems.filter(i => !dismissedNotScanned.has(i.trackingNumber || i.shipmentId));
    const item = visible[parseInt(btn.dataset.idx, 10)];
    if (!item) return;
    const statusEl = document.getElementById('top-status');

    if (btn.dataset.action === 'ns-dismiss') {
      // Hidden on this device only — it stays in Sendcloud, and comes back on
      // the next check if it's still sitting in Created Labels tomorrow.
      dismissedNotScanned.add(item.trackingNumber || item.shipmentId);
      renderNotScanned();
      return;
    }

    if (btn.dataset.action === 'ns-slot') {
      const header = item.postcode ? `${item.name} (${item.postcode})` : item.name;
      if (!confirm(`Add ${item.name} back as a slot to be re-done today?`)) return;
      try {
        await addOrderAsSlot(header, item.orderNumber ? [item.orderNumber] : (item.shipmentId ? [item.shipmentId] : null),
                             false, false, item.trackingNumber ? [item.trackingNumber] : null);
        statusEl.textContent = `${item.name} added as a slot — edit the products on the warehouse list.`;
      } catch (err) {
        statusEl.textContent = 'Could not add that slot — ' + ((err && err.message) || 'try again') + '.';
      }
      return;
    }

    if (btn.dataset.action === 'ns-print') {
      btn.disabled = true;
      btn.textContent = 'Printing…';
      try {
        const ref = await db.collection('print-requests').add({
          name: item.name,
          postcode: item.postcode || '',
          orderNumbers: item.orderNumber || item.shipmentId || '',
          status: 'pending',
          requestedAt: Date.now()
        });
        const startedAt = Date.now();
        const check = async () => {
          const d = await db.collection('print-requests').doc(ref.id).get();
          const data = d.exists ? d.data() : null;
          if (data && data.status === 'printed') { statusEl.textContent = `Printed ${item.name}'s label.`; btn.disabled = false; btn.textContent = 'Print label'; return; }
          if (data && data.status === 'failed') { statusEl.textContent = `Could not print: ${data.errorMessage || 'unknown error'}`; btn.disabled = false; btn.textContent = 'Print label'; return; }
          if (Date.now() - startedAt > 120000) { statusEl.textContent = 'Timed out — is print-watcher running on the warehouse computer?'; btn.disabled = false; btn.textContent = 'Print label'; return; }
          setTimeout(check, 2000);
        };
        statusEl.textContent = 'Sent to the printer…';
        check();
      } catch (err) {
        statusEl.textContent = 'Could not send that to the printer — ' + ((err && err.message) || 'try again') + '.';
        btn.disabled = false;
        btn.textContent = 'Print label';
      }
    }
  });

  // ---------- Learned products list ----------
  let editingLearnedId = null;   // which row is open for editing

  async function renderLearnedList() {
    try { await renderLearnedListInner(); } catch (e) { showRenderError('the learned products list', e); }
  }

  async function renderLearnedListInner() {
    const listEl = document.getElementById('learned-list');
    const snap = await db.collection('sku-corrections').get();
    if (snap.empty) {
      listEl.innerHTML = '';
      document.getElementById('learned-empty').style.display = 'block';
      return;
    }
    document.getElementById('learned-empty').style.display = 'none';
    const rows = snap.docs
      .slice()
      .sort((a, b) => String(a.data().sku || '').localeCompare(String(b.data().sku || '')))
      .map(doc => {
        const d = doc.data();
        const sku = escapeHtml(d.sku || '');
        const label = escapeHtml(d.label || '');
        const per = d.unitsPerItem || 1;
        const fixed = d.mode === 'fixed';

        if (editingLearnedId === doc.id) {
          return `
            <div class="learned-row" data-id="${doc.id}">
              <div class="learned-sku">${sku}</div>
              <div class="learned-edit-form">
                <div class="learned-field-label">Product text</div>

                <div class="learned-field-label">How many per item</div>

                <label class="learned-fixed-row">
                  <input type="checkbox" class="learned-input-fixed" data-id="${doc.id}" ${fixed ? 'checked' : ''} />
                  <span>Always write this exact text, whatever the quantity</span>
                </label>
                <div class="learned-actions">

                  <button class="learned-btn cancel" data-action="cancel-learned">Cancel</button>
                </div>
              </div>
            </div>`;
        }

        const ruleText = fixed
          ? `always &ldquo;${label}&rdquo;`
          : `${label} <span class="learned-per">&mdash; ${per} per item</span>`;
        const example = fixed ? '' : `<div class="learned-rule learned-per">qty 2 &rarr; ${label} x${per * 2}</div>`;
        return `
          <div class="learned-row" data-id="${doc.id}">
            <div class="learned-sku">${sku}</div>
            <div class="learned-rule">${ruleText}</div>
            ${example}

              <button class="learned-btn edit" data-action="edit-learned" data-id="${doc.id}">Edit</button>

            </div>

  async function approveReviewItem(docId) {
    const textarea = document.querySelector(`.compare-converted-textarea[data-id="${docId}"]`);
    const raw = textarea ? textarea.value.trim() : '';
    if (!raw) return;
    const doc = await db.collection('pending-sync-review').doc(docId).get();
    const originalRaw = doc.exists ? String(doc.data().raw || '') : '';
    const orderNumbers = doc.exists ? String(doc.data().orderNumber || '').split(',').map(s => s.trim()).filter(Boolean) : [];
    const trackingNumbers = doc.exists ? String(doc.data().trackingNumber || '').split(',').map(s => s.trim()).filter(Boolean) : [];
    await addOrderAsSlot(raw, orderNumbers, false, false, trackingNumbers);
    await db.collection('pending-sync-review').doc(docId).delete();
    // Offered after the slot is safely saved, so declining to teach — or the
    // prompt failing — can never cost the order itself.
    if (originalRaw && raw !== originalRaw) {
      await offerToLearn(originalRaw, raw);
    }

  // Bulk approve — reads all the review docs in parallel, writes every slot
  // in a single month-document update, then clears the review docs in
  // parallel. Approving one at a time meant three round trips per order and
  // was the reason a large batch looked frozen.
  // Returns the number actually added.
  async function approveReviewItems(docIds, onProgress) {
    const items = [];
    let read = 0;
    await runInBatches(docIds, 25, async (docId) => {
      const textarea = document.querySelector(`.compare-converted-textarea[data-id="${docId}"]`);
      const raw = textarea ? textarea.value.trim() : '';
      if (!raw) return;
      const doc = await db.collection('pending-sync-review').doc(docId).get();
      const orderNumbers = doc.exists ? String(doc.data().orderNumber || '').split(',').map(s => s.trim()).filter(Boolean) : [];
      const trackingNumbers = doc.exists ? String(doc.data().trackingNumber || '').split(',').map(s => s.trim()).filter(Boolean) : [];
      items.push({ docId, raw, sourceOrderNumbers: orderNumbers, trackingNumbers });
    }, (done, all) => { read = done; if (onProgress) onProgress(done, all, 'Reading'); });

    if (!items.length) return 0;
    if (onProgress) onProgress(items.length, items.length, 'Saving');
    await addOrdersAsSlots(items);

    await runInBatches(items.map(i => i.docId), 25,
      id => db.collection('pending-sync-review').doc(id).delete(),
      (done, all) => { if (onProgress) onProgress(done, all, 'Clearing'); });
    return items.length;
  }
  // "Not Processed" — adds the order as a real slot in Warehouse view, same
  // as approving, but flagged with a persistent hazard-stripe border so
  // staff can see at a glance it's a courier-processing issue, not a

  async function markNotProcessed(docId) {
    const textarea = document.querySelector(`.compare-converted-textarea[data-id="${docId}"]`);
    const raw = textarea ? textarea.value.trim() : '';

    const orderNumbers = doc.exists ? String(doc.data().orderNumber || '').split(',').map(s => s.trim()).filter(Boolean) : [];
    await addOrderAsSlot(raw, orderNumbers, true);
    await db.collection('pending-sync-review').doc(docId).delete();
  }

  const busyReviewIds = new Set();

  async function handleReviewListClick(e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const docId = btn.dataset.id;

    if (busyReviewIds.has(docId)) return;   // already working on this one

    if (action === 'reject-one' && !confirm('Reject this order? It will not be added as a slot.')) return;

    busyReviewIds.add(docId);
    // Every button on this card goes dead, not just the one pressed, so an
    // approve can't be followed by a reject on the same order mid-flight.
    const card = btn.closest('.review-card');
    const cardButtons = card ? [...card.querySelectorAll('button')] : [btn];
    const originalText = btn.textContent;
    cardButtons.forEach(b => { b.disabled = true; });
    btn.textContent = action === 'approve-one' ? 'Adding…'
                    : action === 'reject-one' ? 'Rejecting…'
                    : 'Saving…';
    if (card) card.style.opacity = '0.6';

    try {
      if (action === 'approve-one') {
        await approveReviewItem(docId);
      } else if (action === 'reject-one') {
        await rejectReviewItem(docId);
      } else if (action === 'mark-notprocessed') {

      busyReviewIds.delete(docId);

  const NOT_COMPLETE_KEY = 'not-complete-orders';

  // ---------- Bulk delete via the Firestore REST API ----------
  // Fetching a page of documents the normal way downloads every field of
  // every record, and skipped-duplicate records carry a copy of the Sendcloud
  // shipment data. A __name__ select mask returns document ids only, so
  // almost nothing comes down the wire, and the SDK's own batch then commits
  // up to 500 deletions per round trip.
  const FIRESTORE_REST = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;

  async function firestoreErrorReason(res) {
    try {
      const body = await res.json();
      const err = body && (body.error || (Array.isArray(body) && body[0] && body[0].error));
      if (err) return `${err.status || res.status}: ${err.message || ''}`.trim();
    } catch (e) { /* body wasn't JSON */ }
    return String(res.status);
  }

  // Retries with backoff on 429/503. Brief throttling clears; an exhausted
  // daily quota doesn't, and then the real reason is reported.
  async function firestoreFetch(url, body, attempt = 0) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) return res;
    if ((res.status === 429 || res.status === 503) && attempt < 5) {
      const waitMs = Math.min(1000 * Math.pow(2, attempt), 16000);
      const statusEl = document.getElementById('top-status');
      if (statusEl) statusEl.textContent = `Firestore is throttling — waiting ${waitMs / 1000}s before retrying…`;
      await new Promise(r => setTimeout(r, waitMs));
      return firestoreFetch(url, body, attempt + 1);
    }
    const reason = await firestoreErrorReason(res);
    const err = new Error(reason);
    err.status = res.status;
    throw err;
  }

  async function countCollection(collName) {
    try {
      const res = await firestoreFetch(`${FIRESTORE_REST}:runAggregationQuery`, {
        structuredAggregationQuery: {
          structuredQuery: { from: [{ collectionId: collName }] },
          aggregations: [{ alias: 'n', count: {} }]
        }
      });
      const data = await res.json();
      const row = Array.isArray(data) ? data.find(d => d.result) : null;
      const v = row && row.result && row.result.aggregateFields && row.result.aggregateFields.n;
      return v ? Number(v.integerValue) : null;
    } catch (e) {
      return null;
    }
  }

  async function fetchDocumentNames(collName, limit) {
    try {
      const res = await firestoreFetch(`${FIRESTORE_REST}:runQuery`, {
        structuredQuery: {
          from: [{ collectionId: collName }],
          select: { fields: [{ fieldPath: '__name__' }] },
          limit
        }
      });
      const data = await res.json();
      if (!Array.isArray(data)) return [];
      return data.filter(d => d.document).map(d => d.document.name);
    } catch (e) {
      // Falls back to the SDK, which works but downloads the full records.
      const snap = await db.collection(collName).limit(limit).get();
      return snap.docs.map(d => `/documents/${collName}/${d.id}`);
    }
  }

  // The SDK's batch, NOT the REST :batchWrite endpoint — that one
  // authenticates through Google Cloud IAM rather than Firestore security
  // rules, so an unauthenticated browser call to it is always refused.
  async function batchDeleteNames(names) {
    const batch = db.batch();
    for (const name of names) {
      const relative = name.split('/documents/')[1];
      if (!relative) continue;
      const slash = relative.indexOf('/');
      batch.delete(db.collection(relative.slice(0, slash)).doc(relative.slice(slash + 1)));
    }
    await batch.commit();
  }

  async function deleteCollectionInPages(collName, onProgress, pageSize = 300) {
    let total = 0;
    while (true) {
      const names = await fetchDocumentNames(collName, pageSize);
      if (!names.length) break;
      await batchDeleteNames(names);
      total += names.length;
      if (onProgress) onProgress(total);
      if (names.length < pageSize) break;
      await new Promise(r => setTimeout(r, 150));
    }
    return total;
  }

  // ---------- Clear All (queue + duplicates) ----------
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-bulk="clear-everything"]');
    if (!btn || btn.disabled) return;
    const buttons = [...document.querySelectorAll('[data-bulk="clear-everything"]')];
    const statusEl = document.getElementById('top-status');
    buttons.forEach(b => { b.disabled = true; });
    statusEl.textContent = 'Counting…';

    let reviewTotal = null, skippedTotal = null;
    try {
      reviewTotal = await countCollection('pending-sync-review');
      skippedTotal = await countCollection('sync-skipped-duplicates');
    } catch (err) { /* counting is a nicety */ }

    const known = reviewTotal !== null && skippedTotal !== null;
    if (known && reviewTotal + skippedTotal === 0) {
      statusEl.textContent = 'Nothing to clear — both lists are already empty.';
      buttons.forEach(b => { b.disabled = false; });
      return;
    }
    const detail = known
      ? `This deletes ${reviewTotal} review item(s) and ${skippedTotal} skipped-duplicate record(s).`
      : 'This clears the whole review queue and every skipped-duplicate record.';
    if (!confirm(`Clear everything? ${detail} Nothing will be added as a slot.`)) {
      statusEl.textContent = '';
      buttons.forEach(b => { b.disabled = false; });
      return;
    }

    let reviewCleared = 0, skippedCleared = 0;
    try {
      reviewCleared = await deleteCollectionInPages('pending-sync-review', n => {
        statusEl.textContent = `Clearing review queue… ${n}${reviewTotal ? ' of ' + reviewTotal : ''}`;
      });
      skippedCleared = await deleteCollectionInPages('sync-skipped-duplicates', n => {
        statusEl.textContent = `Clearing duplicates… ${n}${skippedTotal ? ' of ' + skippedTotal : ''}`;
      });
      statusEl.textContent = `Cleared ${reviewCleared} review item(s) and ${skippedCleared} duplicate record(s).`;
    } catch (err) {
      const msg = (err && err.message) ? err.message : 'unknown error';
      statusEl.textContent = err && err.status === 429
        ? `Firestore refused further requests after clearing ${reviewCleared + skippedCleared}. This is usually the daily quota. Reported: ${msg}`
        : `Stopped after ${reviewCleared + skippedCleared} — ${msg}. Press again to carry on.`;
    }
    buttons.forEach(b => { b.disabled = false; });
    renderReviewQueue();
    renderSkippedList();
  });

  // ---------- Skipped duplicates ----------
  const SKIPPED_DISPLAY_LIMIT = 250;
  async function renderSkippedList() {
    try { await renderSkippedListInner(); } catch (e) { showRenderError('the skipped-duplicates list', e); }
  }

  async function renderSkippedListInner() {
    const listEl = document.getElementById('skipped-list');
    // Records are now one per order number and updated in place rather than
    // appended, so this list stays a manageable size and can show the whole
    // day's skips. Still limited as a safety net.
    const snapshot = await db.collection('sync-skipped-duplicates').orderBy('createdAt', 'desc').limit(SKIPPED_DISPLAY_LIMIT).get();
    if (snapshot.empty) {
      listEl.innerHTML = '';
      setTabCount('skipped', 0, false);
      document.getElementById('skipped-empty').style.display = 'block';
      return;
    }
    setTabCount('skipped', snapshot.size, false);
    document.getElementById('skipped-empty').style.display = 'none';
    const rows = [];
    if (snapshot.size >= SKIPPED_DISPLAY_LIMIT) {
      rows.push(`<div class="tab-empty" style="text-align:left; padding:8px 0;">Showing the ${SKIPPED_DISPLAY_LIMIT} most recent.</div>`);
    }
    snapshot.forEach(doc => {
      const d = doc.data();
      rows.push(`
        <div class="skipped-item" data-id="${doc.id}">
          <div class="skipped-line long-press-target" data-name="${escapeHtml(d.candidateName || '')}"><span class="skipped-label">From Sendcloud:</span> <span class="skipped-name">${escapeHtml(d.candidateName || '')}</span> (${escapeHtml(d.candidatePostcode || 'no postcode')})</div>
          <div class="skipped-line"><span class="skipped-label">Matched to:</span> <span class="skipped-name">${escapeHtml(d.matchedName || '')}</span> — ${escapeHtml(d.matchedSource || '')}</div>
          ${d.productLine ? `<div class="skipped-line"><span class="skipped-label">Products:</span> ${escapeHtml(d.productLine)}</div>` : ''}
          <button data-id="${doc.id}">Not a duplicate — add for review</button>
        </div>`);
    });
    listEl.innerHTML = rows.join('');
  }

  document.getElementById('skipped-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const docId = btn.dataset.id;
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      const reqRef = await db.collection('reprocess-skip-requests').add({ skipDocId: docId, status: 'pending', requestedAt: Date.now() });
      const startedAt = Date.now();
      const check = async () => {
        const doc = await db.collection('reprocess-skip-requests').doc(reqRef.id).get();
        const data = doc.exists ? doc.data() : null;
        if (data && data.status === 'done') {
          renderSkippedList();
          renderReviewQueue();
          return;
        }
        if (data && data.status === 'failed') {
          btn.disabled = false;
          btn.textContent = 'Failed — try again (' + (data.errorMessage || 'unknown error') + ')';
          return;
        }
        if (Date.now() - startedAt > 120000) {
          btn.disabled = false;
          btn.textContent = 'Timed out — is print-watcher running?';
          return;
        }
        setTimeout(check, 1500);
      };
      check();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Failed — try again';
    }
  });

  // ---------- Manual label upload ----------
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function renderManualLabelsListInner() {
    const listEl = document.getElementById('manual-labels-list');
    try {
      const snapshot = await db.collection('manual-labels').where('used', '==', false).get();
      if (snapshot.empty) { listEl.innerHTML = ''; return; }
      const rows = [];
      snapshot.forEach(doc => {
        const d = doc.data();
        rows.push(`
          <div class="manual-labels-list-item" data-id="${doc.id}">
            <span>${escapeHtml(d.name || 'Unnamed')}${d.postcode ? ' (' + escapeHtml(d.postcode) + ')' : ''}</span>
            <button data-id="${doc.id}">Delete</button>
          </div>`);
      });
      listEl.innerHTML = rows.join('');
    } catch (e) {
      listEl.innerHTML = '';
    }
  }

  // ---------- "Other file type" toggle ----------
  // Ticking it means this is a general print (name prints and the like)
  // rather than a scannable shipping label, so only the name is needed.
  const otherTypeBox = document.getElementById('manual-other-type');
  function applyOtherTypeMode() {
    const on = otherTypeBox.checked;
    document.querySelector('.other-type-row').classList.toggle('active', on);
    document.getElementById('manual-postcode').classList.toggle('field-hidden', on);
    document.getElementById('manual-products').classList.toggle('field-hidden', on);
    document.getElementById('btn-upload-manual').textContent = on ? 'Upload File & Add Slot' : 'Upload Label & Add Slot';
  }
  otherTypeBox.addEventListener('change', applyOtherTypeMode);
  applyOtherTypeMode();

  // ---------- Image -> PDF ----------
  // The printer is driven through Sendcloud's Print Client, which takes
  // PDFs. Rather than teach every downstream step about image files, any
  // image is wrapped into a single-page PDF here at upload time, so what
  // gets stored and printed is always a PDF exactly as before.
  //
  // The image is drawn to a canvas first, which means the browser handles
  // decoding — so BMP, PNG, GIF and WEBP all work, not just JPEG — and the
  // canvas re-encodes to JPEG for a compact result.
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be read — try saving it as a JPEG or PNG.')); };
      img.src = url;
    });
  }

  function buildPdfFromJpeg(jpegBytes, pxW, pxH) {
    const maxW = 297, maxH = 420; // A6 in points, a sensible label size
    const scale = Math.min(maxW / pxW, maxH / pxH, 1);
    const drawW = Math.round(pxW * scale);
    const drawH = Math.round(pxH * scale);
    const enc = (s) => Array.from(s, c => c.charCodeAt(0) & 0xff);
    const parts = [];
    const offsets = [0];
    let pos = 0;
    const push = (v) => {
      const b = typeof v === 'string' ? enc(v) : Array.from(v);
      parts.push(b); pos += b.length;
    };
    push('%PDF-1.4\n');
    offsets[1] = pos; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offsets[2] = pos; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    offsets[3] = pos; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${drawW} ${drawH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    offsets[4] = pos;
    push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes);
    push('\nendstream\nendobj\n');
    const content = `q ${drawW} 0 0 ${drawH} 0 0 cm /Im0 Do Q`;
    offsets[5] = pos; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xrefPos = pos;
    let xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);
    const total = parts.reduce((n, p) => n + p.length, 0);
    const out = new Uint8Array(total);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }

  async function imageFileToPdfBase64(file) {
    const img = await loadImage(file);
    // Cap the pixel size so a phone photo doesn't produce a huge document.
    const MAX_PX = 1600;
    const scale = Math.min(MAX_PX / img.naturalWidth, MAX_PX / img.naturalHeight, 1);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';   // flatten any transparency, otherwise PNGs print black
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    const b64 = dataUrl.split(',')[1];
    const bin = atob(b64);
    const jpegBytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) jpegBytes[i] = bin.charCodeAt(i);
    const pdfBytes = buildPdfFromJpeg(jpegBytes, w, h);
    let s = '';
    const CHUNK = 8192; // avoid blowing the argument limit on big files
    for (let i = 0; i < pdfBytes.length; i += CHUNK) {
      s += String.fromCharCode.apply(null, pdfBytes.subarray(i, i + CHUNK));
    }
    return btoa(s);
  }

  document.getElementById('btn-upload-manual').addEventListener('click', async () => {
    const nameInput = document.getElementById('manual-name');
    const postcodeInput = document.getElementById('manual-postcode');
    const productsInput = document.getElementById('manual-products');
    const fileInput = document.getElementById('manual-file');
    const statusEl = document.getElementById('manual-status');
    const btn = document.getElementById('btn-upload-manual');
    const otherType = otherTypeBox.checked;
    const name = nameInput.value.trim();
    const postcode = otherType ? '' : postcodeInput.value.trim();
    const products = otherType ? '' : productsInput.value.trim();
    const file = fileInput.files && fileInput.files[0];

    if (!name) { statusEl.textContent = 'Enter the name first.'; return; }
    if (!otherType && !products) { statusEl.textContent = 'Enter the products ordered first, e.g. "8ply x1 + wood fork x2".'; return; }
    if (!file) { statusEl.textContent = 'Choose a file first.'; return; }

    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const isImage = /^image\//.test(file.type) || /\.(jpe?g|png|bmp|gif|webp)$/i.test(file.name);
    if (!isPdf && !isImage) {
      statusEl.textContent = 'Please choose a PDF, JPEG, PNG or BMP file.';
      return;
    }
    if (isPdf && file.size > 900000) { statusEl.textContent = 'That PDF is too large — double check it\'s the right file.'; return; }
    if (isImage && file.size > 12000000) { statusEl.textContent = 'That image is very large — try a smaller one.'; return; }

    btn.disabled = true;
    statusEl.textContent = isImage ? 'Converting image…' : 'Uploading…';
    try {
      const base64 = isImage ? await imageFileToPdfBase64(file) : await fileToBase64(file);
      // Firestore caps a document at 1 MB, and base64 adds about a third.
      if (base64.length > 950000) {
        throw new Error('the converted file is still too big to store — try a smaller or lower-resolution image');
      }
      statusEl.textContent = 'Uploading…';
      await db.collection('manual-labels').add({ name, postcode, pdfBase64: base64, uploadedAt: Date.now(), used: false });

      const header = postcode ? `${name} (${postcode})` : name;
      // nonScannable tells the Warehouse app to turn this slot blue as soon
      // as it prints, instead of purple — there is no barcode to scan.
      const raw = otherType ? header : header + '\n' + products;
      await addOrderAsSlot(raw, null, false, otherType);

      statusEl.textContent = otherType
        ? `Added — ${name}'s print is ready. It'll turn blue once printed.`
        : `Uploaded and added — ${name}'s slot is ready.`;
      nameInput.value = ''; postcodeInput.value = ''; productsInput.value = ''; fileInput.value = '';
      renderManualLabelsList();
    } catch (e) {
      statusEl.textContent = 'Could not upload — ' + (e && e.message ? e.message : 'try again') + '.';
    }
    btn.disabled = false;
  });

  document.getElementById('manual-labels-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    if (!confirm('Delete this uploaded label?')) return;
    await db.collection('manual-labels').doc(btn.dataset.id).delete();
    renderManualLabelsList();
  });
</script>
</body>
</html>
