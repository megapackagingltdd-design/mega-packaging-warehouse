<script>
(async () => {
  var BASE = 'https://firestore.googleapis.com/v1/projects/mega-packaging-parcels' +
             '/databases/(default)/documents';
  var STOCK_SHA = "39c0ec2c34024926713f4d9e3f17d9e670c8b8bd8c5d1c33fe09878515b01659";
  var STOCK_DATE = "2026-11-07";

  function boot(msg) {
    var el = document.getElementById('boot');
    if (el) el.innerHTML = msg;
  }

  async function ungzip(b64) {
    var bin = Uint8Array.from(atob(b64.trim()), function (c) { return c.charCodeAt(0); });
    var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf))
      .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  // ?stock=1 forces the built-in page. It is the way back if a published
  // one ever turns out to be broken, so it is checked before anything is
  // fetched and it cannot be overridden from outside.
  var forceStock = /[?&]stock=1/.test(location.search);
  var html = null, where = 'built in (' + STOCK_DATE + ')';

  if (!forceStock) {
    try {
      var res = await fetch(BASE + '/print-watcher-control/sync-page', { cache: 'no-store' });
      if (res.ok) {
        var f = (await res.json()).fields || {};
        var paused = !!(f.paused && f.paused.booleanValue);
        var gz = f.bodyGz && f.bodyGz.stringValue;
        var want = (f.sha256 && f.sha256.stringValue) || '';
        var version = (f.version && f.version.stringValue) || '';
        if (!paused && gz) {
          var text = await ungzip(gz);
          var got = await sha256(text);
          // Every one of these has to hold. A page that half-loads is worse
          // than an older page that works, because nobody can tell which
          // they are looking at.
          if (want && got !== want) {
            console.warn('published page does not match its checksum — using the built-in one');
          } else if (text.length < 20000 || !/<\/html>/i.test(text)) {
            console.warn('published page looks truncated — using the built-in one');
          } else {
            html = text;
            where = 'published ' + (version || 'version');
          }
        }
      }
    } catch (e) {
      console.warn('could not reach the published page:', e && e.message);
    }
  }

  if (!html) {
    try {
      html = await ungzip(document.getElementById('stock-body').textContent);
    } catch (e) {
      boot('<h1>The sync page could not start.</h1>' +
           '<p>Neither the published copy nor the built-in one would load.</p>' +
           '<p>' + String((e && e.message) || e) + '</p>');
      return;
    }
  }

  // Replaces this document entirely, scripts and all, which is what makes
  // the loaded page a real page rather than something pasted into a corner
  // of this one.
  try {
    document.open();
    document.write(html);
    document.close();
    console.log('Sync page loaded: ' + where);
  } catch (e) {
    boot('<h1>The sync page could not start.</h1><p>' +
         String((e && e.message) || e) + '</p>' +
         '<p>Try <code>?stock=1</code> on the end of the address.</p>');
  }
})();
</script>
